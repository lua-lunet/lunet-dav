name: Build & Test

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Cancel previous runs when a new commit is pushed to the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Pinned lunet release to consume. Keep in sync with Dockerfile's LUNET_VERSION
  # build arg. Must be >= v0.4.3 (first release to ship postgres.so; see
  # https://github.com/lua-lunet/lunet/issues/109) and to carry the lnt_shared
  # rename (ngx_shared -> lnt_shared, see docs/DESIGN.md §12.0).
  LUNET_VERSION: v0.4.3

jobs:
  # lunet-run/lunet.so/postgres.so come from lunet's prebuilt release archives —
  # no xmake build needed for those. lunet.lnt_shared (the shared in-process
  # store, see docs/DESIGN.md §12.0) is NOT in the release archives (only ext/
  # drivers with an xmake target are), so it's still built from source, but it's
  # a small, fast Rust crate (cargo build --release, no xmake/C toolchain setup
  # needed). Also runs lint, which needs no DB. lunet-dav is Postgres-only (see
  # docs/DESIGN.md) — no mysql/sqlite3/paxe/httpc drivers are vendored.
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            release_asset: lunet-linux-amd64.tar.gz
          - os: macos-latest
            release_asset: lunet-macos.tar.gz
          # Disabled pending upstream asset — https://github.com/lua-lunet/lunet/issues/125
          # When a lunet release > v0.4.3 ships lunet-linux-arm64.tar.gz: bump LUNET_VERSION
          # above and uncomment this leg plus the arm64 block in the release job.
          # - os: ubuntu-24.04-arm
          #   release_asset: lunet-linux-arm64.tar.gz

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      # Runtime shared libs for the prebuilt lunet-run/lunet.so/postgres.so
      # (matches the Dockerfile's runtime-image package list), plus Lua 5.1
      # headers + a C toolchain for the cjson build below.
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ca-certificates curl build-essential pkg-config \
          libpq5 libsodium23 libuv1 libluajit-5.1-2 \
          lua5.1 liblua5.1-0-dev luajit libluajit-5.1-dev luarocks

    - name: Install dependencies (macOS)
      # No lua@5.1 formula in Homebrew core (removed upstream); LuaJIT ships its own
      # Lua 5.1 ABI-compatible headers, used directly for the cjson build below.
      if: runner.os == 'macOS'
      run: brew install pkg-config libuv luajit libsodium libpq luarocks

    - name: Download lunet ${{ env.LUNET_VERSION }} release
      run: |
        mkdir -p bin/lunet
        curl -fsSL -o "${{ runner.temp }}/lunet-release.tar.gz" \
          "https://github.com/lua-lunet/lunet/releases/download/${{ env.LUNET_VERSION }}/${{ matrix.release_asset }}"
        tar -xzf "${{ runner.temp }}/lunet-release.tar.gz" -C bin ./lunet-run ./lunet.so ./lunet/postgres.so
        chmod +x bin/lunet-run

    - name: Clone lunet ${{ env.LUNET_VERSION }} (for ext/lnt_shared source only)
      # Cloned OUTSIDE the checked-out repo (runner.temp), not into a repo-relative
      # path: lunet's own tree includes busted spec files (spec/*.lua) that use
      # luassert chains (assert.are.equal) our .luarc.json doesn't type — linting
      # them as part of "." previously broke `make lint`.
      run: git clone --depth 1 --branch "${{ env.LUNET_VERSION }}" https://github.com/lua-lunet/lunet "${{ runner.temp }}/lunet-src"

    - name: Build lnt_shared (Rust, not in the release archives)
      working-directory: ${{ runner.temp }}/lunet-src/ext/lnt_shared
      run: |
        cargo build --release
        cp lnt_shared.lua "${{ github.workspace }}/bin/lunet/lnt_shared.lua"
        if [ "${{ runner.os }}" = "macOS" ]; then
          cp target/release/liblnt_shared.dylib "${{ github.workspace }}/bin/lunet/liblnt_shared.dylib"
        else
          cp target/release/liblnt_shared.so "${{ github.workspace }}/bin/lunet/liblnt_shared.so"
        fi

    - name: "Build cjson (Linux: against system Lua 5.1 headers)"
      if: runner.os == 'Linux'
      run: |
        luarocks --lua-version=5.1 install lua-cjson --tree="${{ runner.temp }}/luarocks"
        cp "${{ runner.temp }}/luarocks/lib/lua/5.1/cjson.so" bin/cjson.so

    - name: "Build cjson (macOS: against LuaJIT's own Lua 5.1 ABI-compatible headers)"
      if: runner.os == 'macOS'
      run: |
        luarocks --lua-version=5.1 install lua-cjson --tree="${{ runner.temp }}/luarocks" \
          LUA_INCDIR="$(brew --prefix luajit)/include/luajit-2.1" \
          LUA_LIBDIR="$(brew --prefix luajit)/lib" \
          LUA_BINDIR="$(brew --prefix luajit)/bin"
        cp "${{ runner.temp }}/luarocks/lib/lua/5.1/cjson.so" bin/cjson.so

    - name: "Build lxp (Linux: libexpat1-dev + luarocks luaexpat)"
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libexpat1-dev
        luarocks --lua-version=5.1 install luaexpat --tree="${{ runner.temp }}/luarocks-lxp"
        mkdir -p bin/lxp
        cp "${{ runner.temp }}/luarocks-lxp/lib/lua/5.1/lxp.so" bin/lxp.so
        cp "${{ runner.temp }}/luarocks-lxp/share/lua/5.1/lxp/lom.lua" bin/lxp/lom.lua

    - name: "Build lxp (macOS: brew expat + luarocks luaexpat)"
      if: runner.os == 'macOS'
      run: |
        brew install expat
        EXPAT_PREFIX=$(brew --prefix expat)
        luarocks --lua-version=5.1 install luaexpat \
          --tree="${{ runner.temp }}/luarocks-lxp" \
          EXPAT_DIR="$EXPAT_PREFIX" \
          LUA_INCDIR="$(brew --prefix luajit)/include/luajit-2.1" \
          LUA_LIBDIR="$(brew --prefix luajit)/lib" \
          LUA_BINDIR="$(brew --prefix luajit)/bin"
        mkdir -p bin/lxp
        cp "${{ runner.temp }}/luarocks-lxp/lib/lua/5.1/lxp.so" bin/lxp.so
        cp "${{ runner.temp }}/luarocks-lxp/share/lua/5.1/lxp/lom.lua" bin/lxp/lom.lua

    - name: Native smoke (verify bin/ artifacts load)
      run: |
        mkdir -p target
        echo 'package.path = "./bin/?.lua;" .. package.path; package.cpath = "./bin/?.so;./bin/lunet/?.so;" .. package.cpath; local cjson = require("cjson"); local lom = require("lxp.lom"); assert(lom.parse("<a/>")); print("smoke OK")' > target/smoke.lua
        ./bin/lunet-run target/smoke.lua
        rm -f target/smoke.lua

    - name: Setup mise
      uses: jdx/mise-action@v2

    - name: Lint
      run: make lint

    - name: Upload bin/ artifact
      uses: actions/upload-artifact@v4
      with:
        name: lunet-dav-bin-${{ matrix.os }}
        path: bin/

  # Runs the full e2e gate (ephemeral Postgres 16 + MinIO via docker compose,
  # schema, server, all hurl compat suites + config suite, busted unit tests).
  # GitHub-hosted macOS runners cannot run Docker service containers, so the
  # DB-backed integration test runs on Linux only; both OSes are still
  # build+lint verified above.
  test:
    name: Test (Postgres 16 + MinIO)
    needs: build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies
      # bin/lunet-run, lunet.so, postgres.so, and lnt_shared.so are prebuilt/vendored
      # (from the build job's artifact), so only their runtime shared libs are needed
      # at runtime. lib/crypto.lua does ffi.load("sodium"), which needs an UNVERSIONED
      # libsodium.so; apt's runtime package only installs the versioned libsodium.so.<N>,
      # so add the symlink (same fix as the Dockerfile's runtime stage). lua-expat is
      # required for the DAV XML parsing (item010a). luarocks + lua5.1 + headers +
      # toolchain are needed to install and run busted (luasystem compiles a C rock).
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libpq5 libsodium23 libuv1 libluajit-5.1-2 lua-expat \
          luarocks lua5.1 liblua5.1-0-dev build-essential pkg-config
        sodium_lib="$(ldconfig -p | grep -m1 libsodium.so | awk '{print $NF}')"
        sudo ln -sf "$sodium_lib" "$(dirname "$sodium_lib")/libsodium.so"

    - name: Download bin/ artifact
      uses: actions/download-artifact@v4
      with:
        name: lunet-dav-bin-ubuntu-latest
        path: bin

    - name: Restore executable bit
      run: chmod +x bin/lunet-run

    - name: Setup mise
      uses: jdx/mise-action@v2

    - name: Install busted + run unit tests
      run: |
        sudo luarocks --lua-version=5.1 install busted
        busted spec/unit/

    - name: Full e2e gate (infra + schema + server + all hurl suites)
      run: bash e2e/run-e2e.sh

  docker-smoke:
    name: Docker image smoke test
    needs: test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build image and run smoke test
      run: bash e2e/docker-smoke.sh

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docker-smoke-build-log
        path: target/docker-smoke-build.log

    - name: Upload image digest
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docker-smoke-image-digest
        path: target/docker-smoke-digest.txt

  release:
    name: Release (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test, docker-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download bin/ artifact (linux-amd64)
      uses: actions/download-artifact@v4
      with:
        name: lunet-dav-bin-ubuntu-latest
        path: staging/lunet-dav-${{ github.ref_name }}-linux-amd64/bin

    - name: Download bin/ artifact (macos-arm64)
      uses: actions/download-artifact@v4
      with:
        name: lunet-dav-bin-macos-latest
        path: staging/lunet-dav-${{ github.ref_name }}-macos-arm64/bin

    # Disabled pending upstream asset — https://github.com/lua-lunet/lunet/issues/125
    # When a lunet release > v0.4.3 ships lunet-linux-arm64.tar.gz: bump LUNET_VERSION
    # above and uncomment this step plus the linux-arm64 block in the tarball assembly.
    # - name: Download bin/ artifact (linux-arm64)
    #   uses: actions/download-artifact@v4
    #   with:
    #     name: lunet-dav-bin-ubuntu-24.04-arm
    #     path: staging/lunet-dav-${{ github.ref_name }}-linux-arm64/bin

    - name: Restore executable bit
      run: |
        chmod +x staging/lunet-dav-${{ github.ref_name }}-linux-amd64/bin/lunet-run
        chmod +x staging/lunet-dav-${{ github.ref_name }}-macos-arm64/bin/lunet-run

    - name: Assemble payload tarballs
      run: |
        TAG="${{ github.ref_name }}"
        mkdir -p dist
        for plat in linux-amd64 macos-arm64; do
          # TODO: when upstream ships lunet-linux-arm64.tar.gz (issue #125),
          # add linux-arm64 to this loop.
          staging_dir="staging/lunet-dav-${TAG}-${plat}"
          cp server.lua Makefile .env.example "${staging_dir}/"
          cp -r app lib compat sql specs "${staging_dir}/"
          tar -czf "dist/lunet-dav-${TAG}-${plat}.tar.gz" -C staging "lunet-dav-${TAG}-${plat}"
        done
        (cd dist && sha256sum *.tar.gz > sha256sums.txt)

    - name: Create GitHub release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="${{ github.ref_name }}"
        gh release create "${TAG}" dist/* --prerelease --generate-notes
