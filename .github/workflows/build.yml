name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Cancel previous runs when a new commit is pushed to the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Pinned lunet source tag to build against. Keep in sync with Dockerfile's
  # LUNET_VERSION build arg.
  LUNET_VERSION: v0.3.1

jobs:
  # Builds the lunet runtime + PostgreSQL driver from source for each OS and
  # assembles this repo's bin/ layout. Also runs lint, which needs no DB.
  # lunet-dav is Postgres-only (see docs/DESIGN.md) — no sqlite3/mysql/paxe/
  # httpc drivers are built.
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install xmake
      uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: latest

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          pkg-config libpq-dev libsodium-dev libuv1-dev \
          lua5.1 liblua5.1-0-dev luajit libluajit-5.1-dev luarocks

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      # No lua@5.1 formula in Homebrew core (removed upstream); LuaJIT ships its own
      # Lua 5.1 ABI-compatible headers, used directly for the cjson build below.
      run: |
        brew install pkg-config libuv luajit libsodium libpq luarocks
        echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

    - name: Clone lunet ${{ env.LUNET_VERSION }}
      # Cloned OUTSIDE the checked-out repo (runner.temp), not into a repo-relative
      # path: lunet's own tree includes busted spec files (spec/*.lua) that use
      # luassert chains (assert.are.equal) our .luarc.json doesn't type — linting
      # them as part of "." previously broke `make lint`.
      run: git clone --depth 1 --branch "${{ env.LUNET_VERSION }}" https://github.com/lua-lunet/lunet "${{ runner.temp }}/lunet-src"

    - name: Configure lunet build
      working-directory: ${{ runner.temp }}/lunet-src
      run: xmake f -m release --lunet_trace=n --lunet_verbose_trace=n -y

    - name: Build lunet core + bin + postgres driver
      working-directory: ${{ runner.temp }}/lunet-src
      run: |
        xmake build lunet
        xmake build lunet-bin
        xmake build lunet-postgres

    - name: Assemble bin/
      run: |
        mkdir -p bin/lunet
        find "${{ runner.temp }}/lunet-src/build" -type f -name lunet-run -exec cp {} bin/lunet-run \;
        find "${{ runner.temp }}/lunet-src/build" -type f -name lunet.so -exec cp {} bin/lunet.so \;
        find "${{ runner.temp }}/lunet-src/build" -type f -name postgres.so -exec cp {} bin/lunet/postgres.so \;
        chmod +x bin/lunet-run

    - name: "Build cjson (Linux: against system Lua 5.1 headers)"
      if: runner.os == 'Linux'
      run: |
        luarocks --lua-version=5.1 install lua-cjson --tree="${{ runner.temp }}/luarocks"
        cp "${{ runner.temp }}/luarocks/lib/lua/5.1/cjson.so" bin/cjson.so

    - name: "Build cjson (macOS: against LuaJIT's own Lua 5.1 ABI-compatible headers)"
      if: runner.os == 'macOS'
      run: |
        luarocks --lua-version=5.1 install lua-cjson --tree="${{ runner.temp }}/luarocks" \
          LUA_INCDIR="$(brew --prefix luajit)/include/luajit-2.1" \
          LUA_LIBDIR="$(brew --prefix luajit)/lib" \
          LUA_BINDIR="$(brew --prefix luajit)/bin"
        cp "${{ runner.temp }}/luarocks/lib/lua/5.1/cjson.so" bin/cjson.so

    - name: Setup mise
      uses: jdx/mise-action@v2

    - name: Lint
      run: make lint

    - name: Upload bin/ artifact
      uses: actions/upload-artifact@v4
      with:
        name: lunet-dav-bin-${{ matrix.os }}
        path: bin/

  # Runs the app against a real PostgreSQL 16 instance. GitHub-hosted macOS
  # runners cannot run Docker service containers, so the DB-backed
  # integration test runs on Linux only; both OSes are still build+lint
  # verified above.
  test:
    name: Test (Postgres 16)
    needs: build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: lunet_dav
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Download bin/ artifact
      uses: actions/download-artifact@v4
      with:
        name: lunet-dav-bin-ubuntu-latest
        path: bin

    - name: Restore executable bit
      run: chmod +x bin/lunet-run

    - name: Setup mise
      uses: jdx/mise-action@v2

    - name: Configure environment
      run: cp .env.example .env

    - name: make init
      run: make init

    - name: make start
      run: make start

    - name: make test
      run: make test

    - name: make stop
      if: always()
      run: make stop
