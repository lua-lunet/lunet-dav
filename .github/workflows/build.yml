name: Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Cancel previous runs when a new commit is pushed to the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # Pinned lunet release to consume. Keep in sync with Dockerfile's LUNET_VERSION
  # build arg. Must be >= v0.4.3 (first release to ship postgres.so; see
  # https://github.com/lua-lunet/lunet/issues/109) and to carry the lnt_shared
  # rename (ngx_shared -> lnt_shared, see docs/DESIGN.md §10.0).
  LUNET_VERSION: v0.4.3

jobs:
  # lunet-run/lunet.so/postgres.so come from lunet's prebuilt release archives —
  # no xmake build needed for those. lunet.lnt_shared (the shared in-process
  # store, see docs/DESIGN.md §10.0) is NOT in the release archives (only ext/
  # drivers with an xmake target are), so it's still built from source, but it's
  # a small, fast Rust crate (cargo build --release, no xmake/C toolchain setup
  # needed). Also runs lint, which needs no DB. lunet-dav is Postgres-only (see
  # docs/DESIGN.md) — no mysql/sqlite3/paxe/httpc drivers are vendored.
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            release_asset: lunet-linux-amd64.tar.gz
          - os: macos-latest
            release_asset: lunet-macos.tar.gz

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      # Runtime shared libs for the prebuilt lunet-run/lunet.so/postgres.so
      # (matches the Dockerfile's runtime-image package list), plus Lua 5.1
      # headers + a C toolchain for the cjson build below.
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ca-certificates curl build-essential pkg-config \
          libpq5 libsodium23 libuv1 libluajit-5.1-2 \
          lua5.1 liblua5.1-0-dev luajit libluajit-5.1-dev luarocks

    - name: Install dependencies (macOS)
      # No lua@5.1 formula in Homebrew core (removed upstream); LuaJIT ships its own
      # Lua 5.1 ABI-compatible headers, used directly for the cjson build below.
      if: runner.os == 'macOS'
      run: brew install pkg-config libuv luajit libsodium libpq luarocks

    - name: Download lunet ${{ env.LUNET_VERSION }} release
      run: |
        mkdir -p bin/lunet
        curl -fsSL -o "${{ runner.temp }}/lunet-release.tar.gz" \
          "https://github.com/lua-lunet/lunet/releases/download/${{ env.LUNET_VERSION }}/${{ matrix.release_asset }}"
        tar -xzf "${{ runner.temp }}/lunet-release.tar.gz" -C bin ./lunet-run ./lunet.so ./lunet/postgres.so
        chmod +x bin/lunet-run

    - name: Clone lunet ${{ env.LUNET_VERSION }} (for ext/lnt_shared source only)
      # Cloned OUTSIDE the checked-out repo (runner.temp), not into a repo-relative
      # path: lunet's own tree includes busted spec files (spec/*.lua) that use
      # luassert chains (assert.are.equal) our .luarc.json doesn't type — linting
      # them as part of "." previously broke `make lint`.
      run: git clone --depth 1 --branch "${{ env.LUNET_VERSION }}" https://github.com/lua-lunet/lunet "${{ runner.temp }}/lunet-src"

    - name: Build lnt_shared (Rust, not in the release archives)
      working-directory: ${{ runner.temp }}/lunet-src/ext/lnt_shared
      run: |
        cargo build --release
        cp lnt_shared.lua "${{ github.workspace }}/bin/lunet/lnt_shared.lua"
        if [ "${{ runner.os }}" = "macOS" ]; then
          cp target/release/liblnt_shared.dylib "${{ github.workspace }}/bin/lunet/liblnt_shared.dylib"
        else
          cp target/release/liblnt_shared.so "${{ github.workspace }}/bin/lunet/liblnt_shared.so"
        fi

    - name: "Build cjson (Linux: against system Lua 5.1 headers)"
      if: runner.os == 'Linux'
      run: |
        luarocks --lua-version=5.1 install lua-cjson --tree="${{ runner.temp }}/luarocks"
        cp "${{ runner.temp }}/luarocks/lib/lua/5.1/cjson.so" bin/cjson.so

    - name: "Build cjson (macOS: against LuaJIT's own Lua 5.1 ABI-compatible headers)"
      if: runner.os == 'macOS'
      run: |
        luarocks --lua-version=5.1 install lua-cjson --tree="${{ runner.temp }}/luarocks" \
          LUA_INCDIR="$(brew --prefix luajit)/include/luajit-2.1" \
          LUA_LIBDIR="$(brew --prefix luajit)/lib" \
          LUA_BINDIR="$(brew --prefix luajit)/bin"
        cp "${{ runner.temp }}/luarocks/lib/lua/5.1/cjson.so" bin/cjson.so

    - name: Setup mise
      uses: jdx/mise-action@v2

    - name: Lint
      run: make lint

    - name: Upload bin/ artifact
      uses: actions/upload-artifact@v4
      with:
        name: lunet-dav-bin-${{ matrix.os }}
        path: bin/

  # Runs the app against a real PostgreSQL 16 instance. GitHub-hosted macOS
  # runners cannot run Docker service containers, so the DB-backed
  # integration test runs on Linux only; both OSes are still build+lint
  # verified above.
  test:
    name: Test (Postgres 16)
    needs: build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: lunet_dav
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install runtime dependencies
      # bin/lunet-run, lunet.so, postgres.so, and lnt_shared.so are prebuilt/vendored
      # (from the build job's artifact), so only their runtime shared libs are needed
      # here — no compiler/headers. lib/crypto.lua does ffi.load("sodium"), which needs
      # an UNVERSIONED libsodium.so; apt's runtime package only installs the versioned
      # libsodium.so.<N>, so add the symlink (same fix as the Dockerfile's runtime stage).
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libpq5 libsodium23 libuv1 libluajit-5.1-2
        sodium_lib="$(ldconfig -p | grep -m1 libsodium.so | awk '{print $NF}')"
        sudo ln -sf "$sodium_lib" "$(dirname "$sodium_lib")/libsodium.so"

    - name: Download bin/ artifact
      uses: actions/download-artifact@v4
      with:
        name: lunet-dav-bin-ubuntu-latest
        path: bin

    - name: Restore executable bit
      run: chmod +x bin/lunet-run

    - name: Setup mise
      uses: jdx/mise-action@v2

    - name: Configure environment
      run: cp .env.example .env

    - name: make init
      run: make init

    - name: make start
      run: make start

    - name: make test
      run: make test

    - name: make stop
      if: always()
      run: make stop
