# e2e infrastructure for lunet-dav (see Makefile `e2e` targets).
#
# Constraints (deliberate):
#   * Pull-only prebuilt images pinned to linux/arm64 (colima on Apple silicon).
#     Nothing is built, so BuildKit is never invoked.
#   * No bind mounts and no named volumes — container-local filesystems only,
#     so `docker compose down` is a complete reset.
#   * High host ports, loopback-bound, to avoid colliding with anything else
#     running on the machine (5432/9000/9001 are commonly taken).
#
# Postgres data and MinIO objects are ephemeral by design: the whole point of
# this stack is a from-scratch, resettable local emulation of the Scaleway
# (MinIO Enterprise) + managed-PG deployment target.

name: lunet-dav-e2e

services:
  postgres:
    image: postgres:16.4-alpine
    platform: linux/arm64
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lunet_dav
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lunet_dav"]
      interval: 1s
      timeout: 3s
      retries: 30

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    platform: linux/arm64
    command: server /data --console-address ":9001"
    # tmpfs (RAM-backed, container-scoped — still no host mounts): keeps object
    # storage independent of docker-disk pressure. MinIO refuses writes (507)
    # when its backing filesystem crosses the min-free threshold, which a
    # crowded shared docker VM can trigger spuriously. Test payloads are tiny.
    tmpfs:
      - /data:size=512m
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:19000:9000"   # S3 API
      - "127.0.0.1:19001:9001"   # web console (admin UI)
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 3s
      retries: 30

  # One-shot: create the bucket and enable versioning (mandatory — the server
  # design asserts GetBucketVersioning == Enabled; see docs/DESIGN.md §2.1).
  # The minio image ships `mc`, so no extra image is needed.
  minio-init:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    platform: linux/arm64
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/lunet-dav
        mc version enable local/lunet-dav
        mc version info local/lunet-dav
    restart: "no"
