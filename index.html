    <h1>RealWorld API — OpenResty Lua</h1>
    <p>
        A <a href="https://github.com/realworld-apps/realworld">RealWorld</a> backend
        implemented with OpenResty, Lua, and PostgreSQL.
    </p>
    <p>
        The API is served under <code>/api/</code> — for example
        <a href="/api/tags"><code>GET /api/tags</code></a> or
        <a href="/api/articles"><code>GET /api/articles</code></a>.
        A health check is available at <a href="/health"><code>/health</code></a>.
    </p>
    <p>
        See the <a href="https://github.com/realworld-apps/realworld/blob/main/specs/api/openapi.yml">OpenAPI specification</a>
        for the full endpoint reference.
    </p>
